
name: Build FuelGuard Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'FuelGuard-Manager/**'
      - 'FuelGuard-Driver/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: FuelGuard-Manager
            folder: FuelGuard-Manager
          - app: FuelGuard-Driver
            folder: FuelGuard-Driver

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        working-directory: ${{ matrix.folder }}
        run: npm install

      - name: Prepare Capacitor Android
        working-directory: ${{ matrix.folder }}
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Build APK
        working-directory: ${{ matrix.folder }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-APK
          path: ${{ matrix.folder }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
